name: Veredicto Armando — viernes 3pm MX

# RETIRADO del schedule 2026-06-05: la cuenta subió a Workers Paid (250 cron
# triggers) y el cron volvió a Cloudflare (wrangler.jsonc triggers.crons, mismo
# horario). Este workflow queda SOLO como disparo manual de respaldo.
# Llama POST /report/notify del worker del kanban, que computa el veredicto F3 y manda Telegram a Mario.
# Secrets requeridos en este repo:
#   - KANBAN_NOTIFY_TOKEN: mismo valor que el secret NOTIFY_TOKEN del worker.

on:
  workflow_dispatch: # boton manual de respaldo / pruebas

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: POST al worker
        run: |
          set -e
          response=$(curl -sS -X POST \
            -H "X-Notify-Token: ${{ secrets.KANBAN_NOTIFY_TOKEN }}" \
            -w "\n%{http_code}" \
            --max-time 30 \
            "https://kanban-disetight-band-76ce.contacto-ed2.workers.dev/report/notify")
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n 1)
          echo "HTTP $code"
          echo "$body"
          if [ "$code" != "200" ]; then exit 1; fi
